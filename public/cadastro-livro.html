<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cadastrar Livro - BookZone</title>

  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" 
    rel="stylesheet"
  >
  <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">BookZone</a>
    </div>
  </nav>

  <main class="container my-5">

    <h1 class="text-center mb-4">Cadastrar Livro</h1>

    <form id="form-livro" class="mx-auto bg-white shadow rounded p-4" style="max-width:600px;">

      <input 
        type="text" 
        id="titulo" 
        class="form-control my-2" 
        placeholder="Título do livro"
        required
      >

      <input 
        type="text" 
        id="autor" 
        class="form-control my-2" 
        placeholder="Autor"
        required
      >

      <input 
        type="text" 
        id="categoria" 
        class="form-control my-2" 
        placeholder="Categoria"
        required
      >

      <input 
        type="text" 
        id="valor" 
        class="form-control my-2" 
        placeholder="Valor. Ex: R$ 39,90"
        required
      >

      <input 
        type="text" 
        id="imagem" 
        class="form-control my-2" 
        placeholder="Caminho da imagem. Ex: img/livro.png"
        required
      >

      <textarea 
        id="descricaoCurta" 
        class="form-control my-2" 
        placeholder="Descrição curta"
        required
      ></textarea>

      <textarea 
        id="descricaoCompleta" 
        class="form-control my-2" 
        placeholder="Descrição completa"
        required
      ></textarea>

      <input 
        type="text" 
        id="tags" 
        class="form-control my-2" 
        placeholder="Tags separadas por vírgula. Ex: fantasia, aventura"
      >

      <button type="submit" class="btn btn-dark w-100 mt-3">
        Cadastrar
      </button>

      <p id="mensagem" class="text-center mt-3"></p>

    </form>

  </main>

  <script>
    const API_URL = "http://localhost:3000";
    const formLivro = document.getElementById("form-livro");
    const mensagem = document.getElementById("mensagem");

    formLivro.addEventListener("submit", async function(event) {
      event.preventDefault();

      const novoLivro = {
        titulo: document.getElementById("titulo").value,
        autor: document.getElementById("autor").value,
        categoria: document.getElementById("categoria").value,
        valor: document.getElementById("valor").value,
        imagem: document.getElementById("imagem").value,
        descricaoCurta: document.getElementById("descricaoCurta").value,
        descricaoCompleta: document.getElementById("descricaoCompleta").value,
        tags: document.getElementById("tags").value.split(",").map(tag => tag.trim()),
        destaque: false
      };

      try {
        const resposta = await fetch(`${API_URL}/livros`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(novoLivro)
        });

        if (resposta.ok) {
          mensagem.innerText = "Livro cadastrado com sucesso!";
          mensagem.className = "text-success text-center mt-3";
          formLivro.reset();
        } else {
          mensagem.innerText = "Erro ao cadastrar livro.";
          mensagem.className = "text-danger text-center mt-3";
        }
      } catch (erro) {
        mensagem.innerText = "Erro de conexão com o servidor.";
        mensagem.className = "text-danger text-center mt-3";
      }
    });
  </script>

  <script 
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
  </script>

</body>
</html>
